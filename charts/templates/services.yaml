apiVersion: v1
kind: Service
metadata:
  name: movie-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: movie-service

---
apiVersion: v1
kind: Service
metadata:
  name: cast-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: cast-service

---
# Movie Database
apiVersion: v1
kind: Service
metadata:
  name: movie-db
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: movie-db

---
# Cast Database
apiVersion: v1
kind: Service
metadata:
  name: cast-db
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: cast-db