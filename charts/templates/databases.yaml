{{- range $name, $db := dict "movie" .Values.movieDb "cast" .Values.castDb }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-db
spec:
  serviceName: {{ $name }}-db
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}-db
  template:
    metadata:
      labels:
        app: {{ $name }}-db
    spec:
      containers:
        - name: postgres
          image: {{ $db.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $db.database | quote }}
            - name: POSTGRES_USER
              value: {{ $db.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-db-secret
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $db.storage }}
{{- end }}
