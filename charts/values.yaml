# Movie API
movie:
  replicas: 1
  image:
    repository: movie-service
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8000

# Cast API
cast:
  replicas: 1
  image:
    repository: cast-service
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8000

# Movie Database
movieDb:
  image: postgres:12.1-alpine
  database: movie_db_dev
  username: movie_db_username
  storage: 1Gi

# Cast Database
castDb:
  image: postgres:12.1-alpine
  database: cast_db_dev
  username: cast_db_username
  storage: 1Gi

# External access
ingress:
  enabled: true
  className: traefik